version: '3.8'

services:
  scouter:
    build: .
    volumes:
      - ./reports:/app/reports
      - ./evidence:/app/evidence
      - ./logs:/app/logs
      - ./rules:/app/rules
    # Extra hosts is needed on Linux to reach host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # URL to reach OmniRoute running on the host
      - API_BASE_URL=http://host.docker.internal:20128/v1
      # Model identifier for OmniRoute
      - AI_MODEL=google/gemini-pro
